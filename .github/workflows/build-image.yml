name: build-image

# Builds the SD-card images — Raspberry Pi OS Lite (current release) with
# RPi ALERT installed — for 64-bit and 32-bit Pis, and publishes them as a
# GitHub release with their Raspberry Pi Imager entries. The Pages site
# (pages.yml) then picks the release up for its os_list.json.
#
# Two ways to release:
#   * push a tag:     git tag v0.2.0 && git push origin v0.2.0
#   * from Actions:   Actions → build-image → Run workflow → release tag v0.2.0
#                     (GitHub makes the tag on the commit it built)
# The tag must be "v" + agent/package.json's version: the image files and the
# Imager download links are named from it. Run without a tag, the images are
# only kept as build artifacts.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      arch:
        description: 'arm64, armhf or both'
        default: both
      release_tag:
        description: 'Publish as this release (e.g. v0.2.0; must match agent/package.json). Empty: build only.'
        default: ''

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        name: Release tag, checked against the agent's version
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          version=$(python3 -c "import json;print(json.load(open('agent/package.json'))['version'])")
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag=$GITHUB_REF_NAME; else tag=$INPUT_TAG; fi
          if [ -n "$tag" ] && [ "$tag" != "v$version" ]; then
            echo "::error::release tag $tag does not match agent/package.json version $version (expected v$version)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version $version, release tag: ${tag:-none (build only)}"

  image:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, armhf]
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'workflow_dispatch' || inputs.arch == 'both' || inputs.arch == matrix.arch
      - name: Build tools
        if: github.event_name != 'workflow_dispatch' || inputs.arch == 'both' || inputs.arch == matrix.arch
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-user-static binfmt-support fdisk dosfstools mtools xz-utils e2fsprogs python3
          # Register the qemu handlers with the fix-binary flag, so the chroot needs no copy of qemu.
          sudo systemctl restart systemd-binfmt || true
          ls /proc/sys/fs/binfmt_misc/
      - name: Build the image
        if: github.event_name != 'workflow_dispatch' || inputs.arch == 'both' || inputs.arch == matrix.arch
        run: sudo build/build-image.sh --arch ${{ matrix.arch }} --out out
      - name: Keep it as a build artifact
        if: github.event_name != 'workflow_dispatch' || inputs.arch == 'both' || inputs.arch == matrix.arch
        uses: actions/upload-artifact@v4
        with:
          name: rpi-alert-${{ matrix.arch }}
          path: out/
          retention-days: 14
          compression-level: 0

  # One job publishes, once both images are built — so the release is made
  # once, with everything in it, rather than raced for by the two builds.
  release:
    needs: [plan, image]
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rpi-alert-*
          path: out
          merge-multiple: true
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: RPi ALERT ${{ needs.plan.outputs.tag }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            out/*.img.xz
            out/*.sha256
            out/os-list-*.json
          body: |
            Raspberry Pi SD-card images for RPi ALERT ${{ needs.plan.outputs.tag }} — Raspberry Pi OS Lite with the RPi ALERT agent.

            * **rpi-alert-*-arm64.img.xz** — Pi 3, 3+, 4, 400, 5, 500, Zero 2 W, CM3/4/5 (recommended)
            * **rpi-alert-*-armhf.img.xz** — 32-bit, adds Pi 1, 2, Zero, Zero W (radios and ERT-A2 only; too slow for the RTL-SDR decoder)

            Easiest: the set-up page, https://cdomotor-g.github.io/RPi_ALERT/ — or start Raspberry Pi Imager with
            `--repo https://cdomotor-g.github.io/RPi_ALERT/os_list.json` and pick RPi ALERT. Check a download against its `.sha256`.

            Already running Raspberry Pi OS? No reflash: `curl -fsSL https://raw.githubusercontent.com/cdomotor-g/RPi_ALERT/main/os/bootstrap.sh | sudo bash`
