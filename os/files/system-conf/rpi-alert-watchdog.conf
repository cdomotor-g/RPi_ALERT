# RPi ALERT: the Raspberry Pi's hardware watchdog. If the system hangs hard
# (not just the agent — systemd restarts that), the Pi reboots itself within
# 15 s instead of sitting dead at a site nobody visits. The BCM2835 watchdog
# cannot be set longer than about 15 s.
[Manager]
RuntimeWatchdogSec=15
RebootWatchdogSec=2min
