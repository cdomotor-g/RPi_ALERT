# RPi ALERT: an RTL-SDR stick is a radio receiver here, not a DVB-T TV tuner.
# Without this the kernel's TV driver claims the stick on plug-in and rtl_sdr
# cannot open it ("usb_claim_interface error -6").
blacklist dvb_usb_rtl28xxu
blacklist rtl2832
blacklist rtl2832_sdr
blacklist rtl2830
blacklist r820t
